[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "busbidder"
version = "1.0.0"
description = "Filter, rank and explain competing bus offers from Madrid"
requires-python = ">=3.11"

[project.scripts]
busbidder = "busbidder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]